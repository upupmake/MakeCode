name: Build PyInstaller

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.19.0 pytest

      - name: Verify bundled tree-sitter parser cache
        env:
          MAKECODE_NON_INTERACTIVE: '1'
          TS_PACK_OFFLINE: '1'
        run: >-
          python -c "import subprocess,sys;
          result=subprocess.run([sys.executable,'tools/verify_tree_sitter_offline.py'],timeout=25);
          raise SystemExit(result.returncode)"

      - name: Run tests
        env:
          MAKECODE_NON_INTERACTIVE: '1'
        run: >-
          python -m pytest
          tests/test_delegate_confirmation.py
          tests/test_prompts.py
          tests/test_platform_memory_config.py
          -q

      - name: Build updater
        if: runner.os == 'Windows'
        run: pyinstaller --clean --noconfirm updater.spec

      - name: Build MakeCode
        run: pyinstaller --clean --noconfirm MakeCode.spec

      - name: Verify bundled project modules
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          expected = {"init", "prompts", "settings", "version"}
          for package in ("system", "tools", "utils"):
              for source in Path(package).rglob("*.py"):
                  parts = source.with_suffix("").parts
                  if parts[-1] == "__init__":
                      parts = parts[:-1]
                  expected.add(".".join(parts))

          toc_path = Path("build/MakeCode/PYZ-00.toc")
          if not toc_path.is_file():
              raise SystemExit(f"Missing PyInstaller module manifest: {toc_path}")
          toc = toc_path.read_text(encoding="utf-8")
          missing = sorted(
              module for module in expected
              if not re.search(rf"\('{re.escape(module)}',", toc)
          )
          if missing:
              raise SystemExit(f"Project modules missing from bundle: {', '.join(missing)}")

          analysis_path = Path("build/MakeCode/Analysis-00.toc")
          analysis = analysis_path.read_text(encoding="utf-8")
          runner_os = os.environ["RUNNER_OS"]
          runner_arch = os.environ["RUNNER_ARCH"]
          platform_key = {
              ("Windows", "X64"): "windows-x86_64",
              ("macOS", "ARM64"): "macos-arm64",
          }.get((runner_os, runner_arch))
          if platform_key:
              parser_archive = f"parsers-{platform_key}.tar.zst"
              if parser_archive not in analysis:
                  raise SystemExit(f"Platform parser archive missing from bundle: {parser_archive}")

          warning_path = Path("build/MakeCode/warn-MakeCode.txt")
          warnings = warning_path.read_text(encoding="utf-8")
          project_prefixes = ("init", "prompts", "settings", "version", "system", "tools", "utils")
          missing_warning = []
          for line in warnings.splitlines():
              match = re.search(r"missing module named ['\"]?([^'\" ]+)", line)
              if match and any(
                  match.group(1) == prefix or match.group(1).startswith(f"{prefix}.")
                  for prefix in project_prefixes
              ):
                  missing_warning.append(line)
          if missing_warning:
              raise SystemExit("Project module warnings:\n" + "\n".join(missing_warning))

          print(f"Verified {len(expected)} bundled project modules")
          PY

      - name: Package build outputs
        shell: bash
        run: |
          mkdir -p artifacts release-assets
          cp -R dist/* artifacts/

          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          runner_os = os.environ["RUNNER_OS"]
          runner_arch = os.environ["RUNNER_ARCH"]
          suffix = f"{runner_os}-{runner_arch}"
          dist = Path("dist")
          release_assets = Path("release-assets")

          exe = dist / "MakeCode.exe"
          if runner_os == "Windows" and exe.exists():
              # Windows users usually expect a directly downloadable .exe asset.
              # Do not also upload a Windows zip to the Release; it mostly duplicates the exe.
              shutil.copy2(exe, release_assets / f"MakeCode-{suffix}.exe")
          else:
              # macOS does not use a file extension for executables, so package the dist directory.
              shutil.make_archive(str(release_assets / f"MakeCode-{suffix}"), "zip", dist)
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MakeCode-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/
          if-no-files-found: error

      - name: Upload release assets for release job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ runner.os }}-${{ runner.arch }}
          path: release-assets/
          if-no-files-found: error

  release:
    name: Attach assets to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
