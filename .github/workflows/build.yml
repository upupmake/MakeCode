name: Build PyInstaller

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.19.0 pytest

      - name: Verify bundled tree-sitter parser cache
        env:
          MAKECODE_NON_INTERACTIVE: '1'
          TS_PACK_OFFLINE: '1'
        run: >-
          python -c "import subprocess,sys;
          result=subprocess.run([sys.executable,'tools/verify_tree_sitter_offline.py'],timeout=25);
          raise SystemExit(result.returncode)"

      - name: Run tests
        env:
          MAKECODE_NON_INTERACTIVE: '1'
        run: >-
          python -m pytest
          tests/test_delegate_confirmation.py
          tests/test_prompts.py
          tests/test_platform_memory_config.py
          tests/test_macos_launcher.py
          -q

      - name: Build updater
        if: runner.os == 'Windows'
        run: pyinstaller --clean --noconfirm updater.spec

      - name: Build MakeCode
        run: pyinstaller --clean --noconfirm MakeCode.spec

      - name: Verify bundled project modules
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          expected = {"init", "prompts", "settings", "version"}
          for package in ("system", "tools", "utils"):
              for source in Path(package).rglob("*.py"):
                  parts = source.with_suffix("").parts
                  if parts[-1] == "__init__":
                      parts = parts[:-1]
                  expected.add(".".join(parts))

          toc_path = Path("build/MakeCode/PYZ-00.toc")
          if not toc_path.is_file():
              raise SystemExit(f"Missing PyInstaller module manifest: {toc_path}")
          toc = toc_path.read_text(encoding="utf-8")
          missing = sorted(
              module for module in expected
              if not re.search(rf"\('{re.escape(module)}',", toc)
          )
          if missing:
              raise SystemExit(f"Project modules missing from bundle: {', '.join(missing)}")

          analysis_path = Path("build/MakeCode/Analysis-00.toc")
          analysis = analysis_path.read_text(encoding="utf-8")
          runner_os = os.environ["RUNNER_OS"]
          runner_arch = os.environ["RUNNER_ARCH"]
          platform_key = {
              ("Windows", "X64"): "windows-x86_64",
              ("macOS", "ARM64"): "macos-arm64",
          }.get((runner_os, runner_arch))
          if platform_key:
              parser_archive = f"parsers-{platform_key}.tar.zst"
              if parser_archive not in analysis:
                  raise SystemExit(f"Platform parser archive missing from bundle: {parser_archive}")

          warning_path = Path("build/MakeCode/warn-MakeCode.txt")
          warnings = warning_path.read_text(encoding="utf-8")
          project_prefixes = ("init", "prompts", "settings", "version", "system", "tools", "utils")
          missing_warning = []
          for line in warnings.splitlines():
              match = re.search(r"missing module named ['\"]?([^'\" ]+)", line)
              if match and any(
                  match.group(1) == prefix or match.group(1).startswith(f"{prefix}.")
                  for prefix in project_prefixes
              ):
                  missing_warning.append(line)
          if missing_warning:
              raise SystemExit("Project module warnings:\n" + "\n".join(missing_warning))

          print(f"Verified {len(expected)} bundled project modules")
          PY

      - name: Package build outputs
        shell: bash
        run: |
          mkdir -p artifacts release-assets

          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          runner_os = os.environ["RUNNER_OS"]
          runner_arch = os.environ["RUNNER_ARCH"]
          suffix = f"{runner_os}-{runner_arch}"
          dist = Path("dist")
          release_assets = Path("release-assets")

          if runner_os == "Windows":
              app = dist / "MakeCode"
              if not (app / "MakeCode.exe").is_file() or not (app / "_internal").is_dir():
                  raise SystemExit("Invalid Windows onedir output")
              if not (app / "_internal" / "updater.exe").is_file():
                  raise SystemExit("Bundled updater.exe is missing")
              shutil.copytree(app, Path("artifacts") / app.name)
              shutil.make_archive(
                  str(release_assets / f"MakeCode-{suffix}"), "zip", dist, app.name
              )
          else:
              app = dist / "MakeCode"
              if not (app / "MakeCode").is_file() or not (app / "_internal").is_dir():
                  raise SystemExit("Invalid macOS onedir output")
              launcher = Path("assets/MakeCode.command")
              if not launcher.is_file() or not os.access(launcher, os.X_OK):
                  raise SystemExit("macOS launcher is missing or not executable")
              package = release_assets / "macos-package"
              shutil.copytree(app, package / "MakeCode", symlinks=True)
              shutil.copy2(launcher, package / launcher.name)
              shutil.copytree(package / "MakeCode", Path("artifacts") / "MakeCode", symlinks=True)
              shutil.copy2(package / launcher.name, Path("artifacts") / launcher.name)
          PY

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ditto -c -k release-assets/macos-package \
              "release-assets/MakeCode-${RUNNER_OS}-${RUNNER_ARCH}.zip"
            rm -r release-assets/macos-package
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MakeCode-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/
          if-no-files-found: error

      - name: Upload release assets for release job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ runner.os }}-${{ runner.arch }}
          path: release-assets/
          if-no-files-found: error

  release:
    name: Attach assets to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Generate version manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          archive = Path("release-assets/MakeCode-Windows-X64.zip")
          if not archive.is_file():
              raise SystemExit(f"Missing Windows release asset: {archive}")

          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/releases/tags/{tag}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              release = json.load(response)

          body = release.get("body") or ""
          start_marker = "<!-- makecode-release-log-start -->"
          end_marker = "<!-- makecode-release-log-end -->"
          if start_marker not in body or end_marker not in body:
              raise SystemExit("Release body is missing release log markers")
          release_log = body.split(start_marker, 1)[1].split(end_marker, 1)[0].strip()
          if not release_log:
              raise SystemExit("Release log is empty")

          sha256 = hashlib.sha256()
          with archive.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  sha256.update(chunk)

          base_url = f"https://github.com/{repository}/releases/latest/download"
          manifest = {
              "version": version,
              "download_url": f"{base_url}/{archive.name}",
              "sha256": sha256.hexdigest(),
              "size": archive.stat().st_size,
              "release_log": release_log,
          }
          Path("release-assets/version.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(f"Generated version.json for {version}")
          PY

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: false
