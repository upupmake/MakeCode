name: Build PyInstaller

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build updater
        run: pyinstaller updater.spec

      - name: Prepare updater resource on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # MakeCode.spec currently packages dist/updater.exe into the main app.
          # PyInstaller emits dist/updater on macOS/Linux, so provide the expected resource name.
          cp dist/updater dist/updater.exe

      - name: Build MakeCode
        run: pyinstaller MakeCode.spec

      - name: Package build outputs
        shell: bash
        run: |
          mkdir -p artifacts release-assets
          cp -R dist/* artifacts/

          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          runner_os = os.environ["RUNNER_OS"]
          runner_arch = os.environ["RUNNER_ARCH"]
          suffix = f"{runner_os}-{runner_arch}"
          dist = Path("dist")
          release_assets = Path("release-assets")

          exe = dist / "MakeCode.exe"
          if runner_os == "Windows" and exe.exists():
              # Windows users usually expect a directly downloadable .exe asset.
              # Do not also upload a Windows zip to the Release; it mostly duplicates the exe.
              shutil.copy2(exe, release_assets / f"MakeCode-{suffix}.exe")
          else:
              # macOS/Linux do not use a file extension for executables, so package the dist directory.
              shutil.make_archive(str(release_assets / f"MakeCode-{suffix}"), "zip", dist)
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MakeCode-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/
          if-no-files-found: error

      - name: Upload release assets for release job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ runner.os }}-${{ runner.arch }}
          path: release-assets/
          if-no-files-found: error

  release:
    name: Attach assets to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
