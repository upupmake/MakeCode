[tool.ruff]
target-version = "py312"
extend-exclude = ["skills", "ts_cache", "tiktoken_cache", ".makecode"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "B", "C4", "PIE", "RUF"]
# Nested with-blocks are often clearer, especially in tests; revisit separately.
# Chinese text legitimately uses full-width punctuation in strings, docstrings and comments.
ignore = ["E731", "SIM117", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# These modules intentionally adjust sys.path before importing project packages.
"init.py" = ["E402"]
"utils/llm_client.py" = ["E402"]
"utils/mcp_manager.py" = ["E402"]
"utils/memory.py" = ["E402"]
"utils/teams.py" = ["E402"]
"tests/*" = ["E402"]
"live_tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "live: requires live external services; excluded from CI",
]

[tool.coverage.run]
source = [
    "system",
    "utils",
    "tools",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.mypy]
python_version = "3.12"
files = [
    "utils/paths.py",
    "utils/common.py",
    "utils/file_patch.py",
    "utils/directory_picker.py",
    "utils/tasks.py",
    "utils/skills.py",
    "utils/llm_client.py",
    "utils/memory.py",
    "utils/conversations.py",
    "utils/text_sanitize.py",
    "utils/vision.py",
    "system/cli.py",
    "system/ask_user_backend.py",
    "system/headless_ask.py",
    "system/clipboard.py",
    "system/models.py",
    "system/updater.py",
    "utils/plan_mode.py",
    "utils/text_tokens.py",
    "utils/hitl.py",
    "utils/terminal.py",
    "utils/tool_validation.py",
    "utils/teams.py",
    "utils/mcp_config.py",
    "utils/file_access.py",
    "utils/skill_catalog.py",
    "utils/tool_aliases.py",
    "system/simple_input.py",
    "system/simple_prompt.py",
    "system/simple_terminal.py",
    "system/stream_cancel.py",
    "system/stream_render.py",
    "system/tool_render.py",
    "system/tui_types.py",
    "system/window_attention.py",
    "tools/ask_user.py",
    "tools/extra_tools.py",
    "tools/import_memory_jsonl.py",
    "tools/todo.py",
    "tools/understand_image.py",
    "tools/verify_tree_sitter_offline.py",
]
follow_imports = "silent"
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true
